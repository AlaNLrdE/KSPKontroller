# KSP HMI settings. On the Pi, ~/ksphmi/config.local.toml (kept across deploys) overrides any of these,
# and ./ci deploy_hmi sets the kRPC address to the PC it was run from (KSPHMI_KRPC_ADDRESS in ~/ksphmi/env).

source = "krpc"          # krpc = the game through the kRPC mod; demo = a simulated orbit, no game needed
                         # redux = KSP 2 Redux (UDP 50003); auto = Redux, else kRPC (docs/hmi.rst)

[krpc]
address = "localhost"    # PC running KSP with the kRPC server listening on its LAN address
rpc_port = 50000
stream_port = 50001
rate_hz = 10             # samples per second requested from the game
retry_seconds = 3

[demo]
speed = 20               # time acceleration of the simulated orbit

[display]
output = "sdl"           # sdl = SDL full screen; fbdev = Linux framebuffer; auto = GPU (SDL), else fbdev (Pi service)
fbdev = "/dev/fb0"
fps = 30                 # 30 with the Pi's GPU (~11 ms per frame); the NavBall interpolates between 10 Hz samples
layer_cache = "off"      # on = NavBall-only frames over a cached screen; auto = with a GPU renderer. Off: on the Pi 4
                         # V3D (2026-11-14, --bench 300) it cost more than it saved: full redraw 2.8 ms draw + 11.8 ms
                         # present (3.7 ms CPU); cached NavBall frames 5.3 + 20.5 ms (1.4 ms CPU), full cached 10.5 + 32.7 ms
fullscreen = true
width = 0                # 0 = the monitor's own resolution
height = 0
monitor = "auto"         # auto = the last display when several are connected (the game keeps display 0); or "0", "1"...
skin = "auto"           # auto (default) = ksp1 (Stock) with KSP 1, ksp2 (Redux) with KSP2 Redux; or apollo | classic |
                         # steampunk | ksp1 | ksp2 always
flight_scene = "instruments"  # first flight scene: instruments | cockpit (the clickable panel); Ctrl+"+"/"-" switch

[format]
day_hours = 6            # KSP calendar (6 h days); 24 if the game uses Earth time

[vab]
target = "mun_landing"   # destination highlighted while KSP's delta-v app shows Kerbin; another body picks its own
launch_twr_min = 1.0     # launch stage TWR shown red below this (it cannot leave the pad)
launch_twr_warn = 1.2    # launch stage TWR shown amber below this
upper_twr_warn = 0.8     # upper stages: TWR shown amber below this (long burns, hard circularisation)
# Mission delta-v (what the destinations are judged with): stages in firing order count at Kerbin sea level until
# this much ascent delta-v is spent (the lower atmosphere), later stages in vacuum. 0..100000 m/s.
atmosphere_dv = 1200

# Delta-v from the Kerbin launch pad, m/s, cumulative, from the community delta-v map of the Kerbol system
# (KSP 1.x, "Delta-V map" by u/Kowgan and contributors), without aerobraking: low Kerbin orbit 3400; Mun transfer
# 860, low orbit 310, landing 580; Minmus transfer 930, low orbit 160, landing 180; Kerbin escape 950, then Duna
# transfer 130, capture 250, low orbit 360, landing 1450; Ike from the Duna capture 30, low orbit 180, landing 390;
# Eve transfer 90, capture 80, low orbit 1330; Dres transfer 610, low orbit 1300, landing 430. Aerobraking at Duna
# or Eve saves most of their capture and landing figures. When the app shows another body, the target is that
# body's landing (sea level / altitude) or orbit (vacuum), so keep both for each body. config.local.toml may add
# destinations (a-z, 0-9, _) or change these, at most 12 in all.
[vab.destinations]
kerbin_orbit = 3400
minmus_orbit = 4490
mun_orbit = 4570
minmus_landing = 4670
ike_orbit = 4940
duna_orbit = 5090
mun_landing = 5150
ike_landing = 5330
eve_orbit = 5850
dres_orbit = 6260
duna_landing = 6540
dres_landing = 6690
